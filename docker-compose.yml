version: "3.8"

services:
  module-g:
    build: .
    ports:
      - "8006:8006"
    volumes:
      - ./data:/module_g/data
    environment:
      - PYTHONPATH=/module_g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
